<!DOCTYPE html>
<html lang="en">

<head>
   <title>대도시앱</title>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
   <link rel="stylesheet" type="text/css" href="./css/style.css" />
   <script src="./js/jquery-3.7.1.min.js"></script>
   <script src="./js/jquery-ui.min.js"></script>
   <script src="./js/common.js"></script>
</head>

<body class="app_body">
   <div class="wrap">
      <!-- header S -->
      <header class="has_title">
         <div class="header_info">
            <div class="user_info">
               <span class="user_badge">자원봉사자</span>
               <span class="user_name"><strong>김아영 자매</strong> 서울수서 회중</span>
            </div>
            <div class="user_img">
               <img src="./images/profile01.jpg" alt="">
            </div>
         </div>
         <div class="header_bottom">
            <button class="btn_back"></button>
            <h1>언어선택</h1>
            <button class="btn_close"></button>
         </div>
      </header>
      <!--// header E -->

      <!-- contents S -->
      <div class="contents">
         <div class="language_wrap">
            <p class="change_guide">사용하실 언어를 선택해주세요.</p>

            <ul class="language_list">
               <li>
                  <label class="language_option">
                     <input type="radio" name="language" value="korean">
                     <div class="language_card">
                        <span class="language_text">한국어</span>
                        <span class="language_radio"></span>
                     </div>
                  </label>
               </li>
               <li>
                  <label class="language_option">
                     <input type="radio" name="language" value="chinese" checked>
                     <div class="language_card">
                        <span class="language_text">중국어</span>
                        <span class="language_radio"></span>
                     </div>
                  </label>
               </li>
               <li>
                  <label class="language_option">
                     <input type="radio" name="language" value="english">
                     <div class="language_card">
                        <span class="language_text">영어</span>
                        <span class="language_radio"></span>
                     </div>
                  </label>
               </li>
            </ul>

            <button class="btn_language_confirm">확인</button>
         </div>
      </div>
      <!--// contents E -->

      <nav>
         <ul>
            <li>
               <a href="#">
                  <img src="./images/nav_icon01.svg" alt="">
                  <p>내 일정</p>
               </a>
            </li>
            <li>
               <a href="#">
                  <img src="./images/nav_icon02.svg" alt="">
                  <p>봉사신청</p>
               </a>
            </li>
            <li>
               <a href="#">
                  <img src="./images/nav_icon03.svg" alt="">
                  <p>봉사보고</p>
               </a>
            </li>
            <li>
               <a href="#">
                  <img src="./images/nav_icon04.svg" alt="">
                  <p>공지사항</p>
               </a>
            </li>
            <li class="active">
               <a href="#">
                  <img src="./images/nav_icon05.svg" alt="">
                  <p>설정</p>
               </a>
            </li>
         </ul>
      </nav>
   </div>
</body>

</html>
