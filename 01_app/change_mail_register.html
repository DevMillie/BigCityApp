<!DOCTYPE html>
<html lang="en">

<head>
   <title>대도시앱</title>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
   <link rel="stylesheet" type="text/css" href="./css/style.css" />
   <script src="./js/jquery-3.7.1.min.js"></script>
   <script src="./js/jquery-ui.min.js"></script>
   <script src="./js/common.js"></script>
</head>

<body class="app_body">
   <div class="wrap">
      <!-- header S -->
      <header class="has_title">
         <div class="header_info">
            <div class="user_info">
               <span class="user_badge">자원봉사자</span>
               <span class="user_name"><strong>김아영 자매</strong> 서울수서 회중</span>
            </div>
            <div class="user_img">
               <img src="./images/profile01.jpg" alt="">
            </div>
         </div>
         <!-- fix 헤더 있을 때 -->
         <div class="header_bottom">
            <button class="btn_back"></button>
         </div>
         <!--// fix 헤더 있을 때 -->
      </header>
      <!--// header E -->
      <!-- contents S -->
      <div class="contents">
         <!-- change_phone_wrap S -->
         <div class="change_phone_wrap">
            <p class="change_guide">이메일 주소를 등록해주세요.</p>

            <div class="form_group">
               <label>이메일 주소</label>
               <input type="text" class="phone_input" placeholder="이메일 주소를 입력해주세요">
            </div>

            <button class="btn_info_submit bottom_fixed">이메일 주소 등록하기</button>

         </div>
         <!--// change_phone_wrap E -->
      </div>
      <!--// contents E -->
      <nav>
         <ul>
            <li>
               <a href="#">
                  <img src="./images/nav_icon01.svg" alt="">

               </a>
            </li>
            <li>
               <a href="#">
                  <img src="./images/nav_icon02.svg" alt="">
                  <p>봉사신청</p>
               </a>
            </li>
            <li>
               <a href="#">
                  <img src="./images/nav_icon03.svg" alt="">
                  <p>봉사보고</p>
               </a>
            </li>
            <li>
               <a href="#">
                  <img src="./images/nav_icon04.svg" alt="">
                  <p>공지사항</p>
               </a>
            </li>
            <li class="active">
               <a href="#">
                  <img src="./images/nav_icon05.svg" alt="">
                  <p>설정</p>
               </a>
            </li>

      </nav>
