<!DOCTYPE html>
<html lang="en">

<head>
   <title>대도시앱</title>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
   <link rel="stylesheet" type="text/css" href="./css/style.css" />
   <script src="./js/jquery-3.7.1.min.js"></script>
   <script src="./js/jquery-ui.min.js"></script>
   <script src="./js/common.js"></script>
   <!-- datepicker -->
   <link href="css/datepicker.min.css" rel="stylesheet" type="text/css">
   <script src="js/datepicker.min.js"></script>
   <script src="js/i18n/datepicker.ko.js"></script>
</head>

<body class="app_body">
   <div class="wrap">
      <!-- header S -->
      <header class="has_title">
         <div class="header_info">
            <div class="user_info">
               <span class="user_badge">자원봉사자</span>
               <span class="user_name"><strong>김아영 자매</strong> 서울수서 회중</span>
            </div>
            <div class="user_img">
               <img src="../01_app/images/profile01.jpg" alt="">
            </div>
         </div>
         <!-- fix 헤더 있을 때 -->
         <div class="header_bottom">
            <button class="btn_back"></button>
            <h1>신규 문의하기</h1>
            <button class="btn_close"></button>
         </div>
         <!--// fix 헤더 있을 때 -->
      </header>
      <!--// header E -->
      <!-- contents S -->
      <div class="contents">
         <!-- report_detail_wrap S -->
         <div class="report_detail_wrap">
            <div class="form_group">
               <label for="">제목</label>
               <input type="text" placeholder="제목을 입력해주세요.">
            </div>

            
            <h2>내용</h2>
            <textarea name="" id="" placeholder="내용을 입력해주세요."></textarea>

            <button class="btn_submit">등록하기</button>

         </div>
         <!--// report_detail_wrap E -->
      </div>
      <!--// contents E -->
      <nav>
         <ul>
            <li>
               <a href="#">
                  <img src="../01_app/images/nav_icon01.svg" alt="">

            </li>
            <li>
               <a href="#">
                  <img src="../01_app/images/nav_icon02.svg" alt="">
                  <p>봉사신청</p>
               </a>
            </li>
            <li>
               <a href="#">
                  <img src="../01_app/images/nav_icon03.svg" alt="">
                  <p>봉사보고</p>
               </a>
            </li>
            <li>
               <a href="#">
                  <img src="../01_app/images/nav_icon04.svg" alt="">
                  <p>공지사항</p>
               </a>
            </li>
            <li class="active">
               <a href="#">
                  <img src="../01_app/images/nav_icon05.svg" alt="">
